server:
  port: 8080

spring:
  application:
    name: api-gateway
  http:
    converters:
      preferred-json-mapper: jackson2
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders,/api/orders/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products,/api/products/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments,/api/payments/**
              filters:
                - StripPrefix=1
    loadbalancer:
      cache:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
